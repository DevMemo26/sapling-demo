<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sapling Demo · Task Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Task Board</h1>
      <p class="app__subtitle">Demo de flujo de trabajo con Sapling SCM</p>
      <button class="app__theme" id="theme-toggle" type="button">Modo oscuro</button>
    </header>

    <form class="app__form" id="task-form" autocomplete="off">
      <input
        class="app__input"
        id="task-input"
        type="text"
        placeholder="Escribe una tarea y presiona Enter..."
        aria-label="Nueva tarea"
      />
      <button class="app__button" type="submit">Agregar</button>
    </form>

    <section class="app__stats">
      <span class="stat">Tareas: <strong id="stat-total">0</strong></span>
      <span class="stat">Pendientes: <strong id="stat-pending">0</strong></span>
    </section>
    <div class="app__filters" id="filters">
      <button class="filter is-active" type="button" data-filter="all">Todas</button>
      <button class="filter" type="button" data-filter="pending">Pendientes</button>
      <button class="filter" type="button" data-filter="done">Completadas</button>
    </div>

    <ul class="task-list" id="task-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
